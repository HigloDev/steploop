<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成绩</title>
    <style id="theme-vars">
/* 帕楼原型 · 主题令牌
   基于 src/theme.ts 的浅色主题映射为 CSS 变量
   主色: #12372e (深绿), 语义色: amber/red/blue
*/
:root {
  /* 基础色板 */
  --palou-background: #f3f5f4;
  --palou-foreground: #101916;
  --palou-card: #ffffff;
  --palou-card-foreground: #101916;
  --palou-popover: #ffffff;
  --palou-popover-foreground: #101916;

  /* 主品牌色 */
  --palou-primary: #12372e;
  --palou-primary-foreground: #f3f5f4;

  /* 辅助文本 */
  --palou-muted: #65716c;
  --palou-muted-foreground: #43534d;

  /* 边框/输入 */
  --palou-border: #dce2df;
  --palou-input: #dce2df;
  --palou-ring: #12372e;

  /* 语义状态色 */
  --palou-state-success: #12372e;
  --palou-state-warning: #e7b45a;
  --palou-state-warning-soft: #fff8e8;
  --palou-state-warning-ink: #9b6a15;
  --palou-state-error: #e26058;
  --palou-state-error-soft: #fff1ef;
  --palou-state-info: #2a6b8a;
  --palou-state-info-soft: #e3eef4;

  /* 次级表面 */
  --palou-card-soft: #f7f9f8;
  --palou-surface-soft: #edf1ef;
  --palou-line-soft: #e7ebe9;

  /* 品牌色阶 */
  --palou-primary-ink: #276750;
  --palou-primary-bright: #35715f;
  --palou-primary-soft: #e1f1ea;
  --palou-mint: #71e2b5;

  /* 琥珀色阶 */
  --palou-amber: #e7b45a;
  --palou-amber-soft: #fff8e8;
  --palou-amber-chip: #fff4d9;
  --palou-amber-ink: #9b6a15;

  /* 橙色 */
  --palou-orange: #ff914d;

  /* 红色阶 */
  --palou-red: #e26058;
  --palou-red-soft: #fff1ef;
  --palou-red-chip: #f8dfda;
  --palou-red-ink: #68403d;

  /* 圆角 */
  --palou-radius-sm: 6px;
  --palou-radius-md: 10px;
  --palou-radius-lg: 14px;
  --palou-radius-xl: 16px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--palou-background);
    --color-foreground: var(--palou-foreground);
    --color-card: var(--palou-card);
    --color-card-foreground: var(--palou-card-foreground);
    --color-popover: var(--palou-popover);
    --color-popover-foreground: var(--palou-popover-foreground);
    --color-primary: var(--palou-primary);
    --color-primary-foreground: var(--palou-primary-foreground);
    --color-muted: var(--palou-muted);
    --color-muted-foreground: var(--palou-muted-foreground);
    --color-border: var(--palou-border);
    --color-input: var(--palou-input);
    --color-ring: var(--palou-ring);
    --radius-sm: var(--palou-radius-sm);
    --radius-md: var(--palou-radius-md);
    --radius-lg: var(--palou-radius-lg);
    --radius-xl: var(--palou-radius-xl);
  }
  @layer base {
    body { background: var(--palou-background); color: var(--palou-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .bg-muted-foreground { background-color: var(--palou-muted-foreground); }

      .ring-muted-foreground { --tw-ring-color: var(--palou-muted-foreground); }
      .bg-border { background-color: var(--palou-border); }

      .bg-input { background-color: var(--palou-input); }

      .ring-input { --tw-ring-color: var(--palou-input); }
      .bg-ring { background-color: var(--palou-ring); }
      .text-ring { color: var(--palou-ring); }
      .border-ring { border-color: var(--palou-ring); }
      .ring-ring { --tw-ring-color: var(--palou-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;

</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <div class="palou-frame" data-viewport-mode="document-scroll">
        <div class="palou-frame__inner">

          <!-- ===== Top Bar ===== -->
          <header class="top-bar">
            <button class="top-bar__btn" aria-label="返回">
              <i data-lucide="chevron-left"></i>
            </button>
            <span class="top-bar__title">成绩</span>
            <button class="top-bar__btn" aria-label="分享">
              <i data-lucide="share"></i>
            </button>
          </header>

          <!-- ===== Hero Card ===== -->
          <section class="hero-card">
            <div class="hero-card__deco"></div>
            <div class="hero-card__eyebrow">RESULT</div>
            <h1 class="hero-card__route">武夷大厦·东侧楼梯</h1>
            <div class="hero-card__date">2026.07.28 &nbsp;15:30</div>

            <div class="hero-card__numwrap">
              <span class="hero-card__bignum">8</span>
              <span class="hero-card__numlabel">
                <div class="hero-card__numlabel-main">层</div>
                <div class="hero-card__numlabel-sub">到达楼层</div>
              </span>
            </div>

            <div class="hero-card__status">
              <i data-lucide="check-circle" style="width:14px;height:14px;"></i>
              <span>完整完成</span>
            </div>
            <p class="hero-card__desc">路线全程匹配，且没有检测到传感器中断。</p>
          </section>

          <!-- ===== Key Metrics ===== -->
          <section style="margin-top:24px;">
            <div class="metric-grid">
              <div class="metric-tile">
                <div class="metric-tile__label">
                  <i data-lucide="layers" style="width:13px;height:13px;"></i>
                  完成楼层
                </div>
                <div class="metric-tile__value">7<span class="metric-tile__unit">层</span></div>
              </div>
              <div class="metric-tile">
                <div class="metric-tile__label">
                  <i data-lucide="trending-up" style="width:13px;height:13px;"></i>
                  累计爬升
                </div>
                <div class="metric-tile__value">21.0<span class="metric-tile__unit">m</span></div>
              </div>
              <div class="metric-tile">
                <div class="metric-tile__label">
                  <i data-lucide="clock" style="width:13px;height:13px;"></i>
                  总用时
                </div>
                <div class="metric-tile__value">04:32</div>
              </div>
              <div class="metric-tile">
                <div class="metric-tile__label">
                  <i data-lucide="footprints" style="width:13px;height:13px;"></i>
                  总步数
                </div>
                <div class="metric-tile__value">412</div>
              </div>
              <div class="metric-tile">
                <div class="metric-tile__label">
                  <i data-lucide="bar-chart-3" style="width:13px;height:13px;"></i>
                  平均单层
                </div>
                <div class="metric-tile__value">38.9<span class="metric-tile__unit">s</span></div>
              </div>
              <div class="metric-tile">
                <div class="metric-tile__label">
                  <i data-lucide="trophy" style="width:13px;height:13px;"></i>
                  最快单层
                </div>
                <div class="metric-tile__value">28.3<span class="metric-tile__unit">s</span></div>
              </div>
            </div>
          </section>

          <!-- ===== Detail Card ===== -->
          <section style="margin-top:24px;">
            <div class="detail-card">
              <div class="detail-row">
                <span class="detail-row__label">
                  <i data-lucide="layers" style="width:14px;height:14px;"></i>
                  起止楼层
                </span>
                <span class="detail-row__value">1F → 8F</span>
              </div>
              <div class="detail-row">
                <span class="detail-row__label">
                  <i data-lucide="check-circle" style="width:14px;height:14px;"></i>
                  置信度
                </span>
                <span class="detail-row__value">92%</span>
              </div>
              <div class="detail-row">
                <span class="detail-row__label">
                  <i data-lucide="bar-chart-3" style="width:14px;height:14px;"></i>
                  中断次数
                </span>
                <span class="detail-row__value">0</span>
              </div>
            </div>
          </section>

          <!-- ===== Floor Splits ===== -->
          <section style="margin-top:28px;">
            <div class="section-title" style="margin-bottom:12px;">
              <i data-lucide="bar-chart-3"></i>
              <span>单层用时</span>
            </div>
            <div class="splits-card">
              <!-- 1F -->

                <div class="split-row__floor">1F</div>

                <div class="split-row__time">39.0s</div>
                <div class="split-row__badge" style="visibility:hidden;">最快</div>
              </div>
              <!-- 5F -->
              <div class="split-row">
                <div class="split-row__floor">5F</div>
                <div class="split-row__elapsed">03:06</div>
                <div class="split-row__bar"><div class="split-row__bar-fill" style="width:88.9%;"></div></div>
                <div class="split-row__time">40.0s</div>
                <div class="split-row__badge" style="visibility:hidden;">最快</div>
              </div>

              <div class="split-row">
                <div class="split-row__floor">6F</div>
                <div class="split-row__elapsed">03:47</div>
                <div class="split-row__bar"><div class="split-row__bar-fill" style="width:91.1%;"></div></div>
                <div class="split-row__time">41.0s</div>

              </div>

              <div class="split-row">
                <div class="split-row__floor">7F</div>
                <div class="split-row__elapsed">04:32</div>

            </div>
          </section>

          <!-- ===== Bottom Action Area ===== -->
          <section class="action-area" style="margin-top:32px;">
            <button class="btn-primary">
              <i data-lucide="rotate-ccw" style="width:18px;height:18px;"></i>

          </section>

        </div>
      </div>
    </main>

    <style id="critical-layout">
      /* ===== Mobile frame ===== */
      .palou-frame {
        max-width: 390px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--palou-background);
        position: relative;
        overflow-x: hidden;
      }
      .palou-frame__inner {
        padding: 0 16px 32px;
      }

      /* ===== Top bar ===== */
      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 0 18px;
      }
      .top-bar__btn {
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--palou-radius-md);
        color: var(--palou-foreground);
        background: transparent;
        border: 1px solid transparent;
        transition: background-color .15s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .top-bar__btn:active { background: var(--palou-surface-soft); }
      .top-bar__title {
        font-size: 17px;
        font-weight: 600;
        color: var(--palou-foreground);
        letter-spacing: .02em;
      }

      /* ===== Hero card (poster anchor) ===== */
      .hero-card {
        position: relative;
        background: var(--palou-primary);
        color: var(--palou-primary-foreground);
        border-radius: var(--palou-radius-xl);
        padding: 24px 20px 22px;
        overflow: hidden;
      }
      .hero-card__eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .28em;
        color: var(--palou-mint);
      }
      .hero-card__route {
        margin-top: 8px;
        font-size: 22px;
        line-height: 1.25;
        font-weight: 700;
        color: var(--palou-primary-foreground);
        letter-spacing: .01em;
      }
      .hero-card__date {
        margin-top: 6px;
        font-size: 13px;
        color: color-mix(in srgb, var(--palou-primary-foreground) 66%, transparent);
        font-variant-numeric: tabular-nums;
      }
      .hero-card__numwrap {
        margin-top: 18px;
        display: flex;
        align-items: flex-end;
        gap: 10px;
        line-height: 1;
      }
      .hero-card__bignum {
        font-size: 84px;
        font-weight: 800;
        color: var(--palou-primary-foreground);
        letter-spacing: -.04em;
        font-variant-numeric: tabular-nums;
        line-height: .85;
      }
      .hero-card__numlabel {
        padding-bottom: 10px;
      }
      .hero-card__numlabel-main {
        font-size: 18px;
        font-weight: 700;
        color: var(--palou-mint);
      }
      .hero-card__numlabel-sub {
        font-size: 11px;
        color: color-mix(in srgb, var(--palou-primary-foreground) 55%, transparent);
        margin-top: 2px;
      }
      .hero-card__status {
        margin-top: 18px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px 6px 10px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--palou-mint) 16%, transparent);
        color: var(--palou-mint);
        font-size: 12px;
        font-weight: 600;
      }
      .hero-card__desc {
        margin-top: 10px;
        font-size: 12.5px;
        line-height: 1.55;
        color: color-mix(in srgb, var(--palou-primary-foreground) 72%, transparent);
      }
      .hero-card__deco {
        position: absolute;
        right: -30px;
        top: -30px;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--palou-mint) 8%, transparent);
        pointer-events: none;
      }

      /* ===== Metric grid (2 x 3) ===== */
      .metric-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .metric-tile {
        background: var(--palou-card);
        border: 1px solid var(--palou-line-soft);
        border-radius: var(--palou-radius-md);
        padding: 14px 14px 14px;
      }
      .metric-tile__label {
        font-size: 11.5px;
        color: var(--palou-muted);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .metric-tile__value {
        margin-top: 8px;
        font-size: 22px;
        font-weight: 700;
        color: var(--palou-primary);
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .metric-tile__unit {
        font-size: 12px;
        font-weight: 600;
        color: var(--palou-muted-foreground);
        margin-left: 3px;
      }

      /* ===== Section title ===== */
      .section-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 14px;
        font-weight: 700;
        color: var(--palou-foreground);
      }
      .section-title i, .section-title svg {
        width: 16px;
        height: 16px;
        color: var(--palou-primary-ink);
      }

      /* ===== Detail card ===== */
      .detail-card {
        background: var(--palou-card);
        border: 1px solid var(--palou-line-soft);
        border-radius: var(--palou-radius-lg);
        overflow: hidden;
      }
      .detail-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 14px;
        font-size: 13px;
        border-top: 1px solid var(--palou-line-soft);
      }
      .detail-row:first-child { border-top: none; }
      .detail-row__label {
        color: var(--palou-muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .detail-row__value {
        color: var(--palou-foreground);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      /* ===== Floor splits ===== */
      .splits-card {
        background: var(--palou-card);
        border: 1px solid var(--palou-line-soft);
        border-radius: var(--palou-radius-lg);
        padding: 6px 14px;
      }
      .split-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-top: 1px solid var(--palou-line-soft);
      }
      .split-row:first-child { border-top: none; }
      .split-row__floor {
        flex: 0 0 38px;
        font-size: 14px;
        font-weight: 700;
        color: var(--palou-foreground);
        font-variant-numeric: tabular-nums;
      }
      .split-row__elapsed {
        flex: 0 0 52px;
        font-size: 11.5px;
        color: var(--palou-muted);
        font-variant-numeric: tabular-nums;
      }
      .split-row__bar {
        flex: 1 1 auto;
        height: 6px;
        border-radius: 999px;
        background: var(--palou-surface-soft);
        overflow: hidden;
      }
      .split-row__bar-fill {
        height: 100%;
        border-radius: 999px;
        background: var(--palou-primary-soft);
      }
      .split-row__time {
        flex: 0 0 56px;
        text-align: right;
        font-size: 14px;
        font-weight: 700;
        color: var(--palou-foreground);
        font-variant-numeric: tabular-nums;
      }
      .split-row__badge {
        flex: 0 0 auto;
        font-size: 10px;
        font-weight: 700;
        padding: 3px 7px;
        border-radius: 999px;
        background: var(--palou-amber-chip);
        color: var(--palou-amber-ink);
        letter-spacing: .04em;
      }
      /* Fastest row accent */
      .split-row.is-fastest .split-row__bar-fill {
        background: var(--palou-mint);
      }
      .split-row.is-fastest .split-row__time {
        color: var(--palou-primary);
      }

      /* ===== Bottom action area ===== */
      .action-area {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .btn-primary {
        width: 100%;
        height: 50px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: var(--palou-radius-lg);
        background: var(--palou-primary);
        color: var(--palou-primary-foreground);
        font-size: 15px;
        font-weight: 700;
        border: 1px solid var(--palou-primary);
        transition: transform .12s ease, background-color .15s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .btn-primary:active {
        background: var(--palou-primary-bright);
        transform: scale(.99);
      }
      .btn-secondary {
        width: 100%;
        height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: var(--palou-radius-lg);
        background: var(--palou-card);
        color: var(--palou-foreground);
        font-size: 15px;
        font-weight: 600;
        border: 1px solid var(--palou-border);
        transition: background-color .15s ease, transform .12s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .btn-secondary:active {
        background: var(--palou-surface-soft);
        transform: scale(.99);
      }

      /* ===== Utilities ===== */
      .num { font-variant-numeric: tabular-nums; }
      [data-lucide] { width: 18px; height: 18px; stroke-width: 2; }
    </style>
</body>
