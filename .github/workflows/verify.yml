name: Verify app
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-android-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm run check:project-state
      - name: Install audio verification tool
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npx expo install --check
      - run: npx expo export --platform android --output-dir .expo-export-check/android-ci
      - name: Retain Android bundle evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-bundle-${{ github.sha }}
          path: .expo-export-check/android-ci
          include-hidden-files: true
          retention-days: 7
